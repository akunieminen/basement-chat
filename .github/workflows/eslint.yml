name: Run Code Style Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "*.x"
      - main
      - next
      - next-major
      - beta
      - alpha
      - dev
    paths:
      - resources/js/**
      - eslint.config.js
      - tsconfig.json
      - package.json

jobs:
  code-style-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:ci
