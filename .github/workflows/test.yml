name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - "*.x"
      - main
      - next
      - next-major
      - beta
      - alpha
      - dev
  pull_request:
    branches:
      - "*.x"
      - main
      - next
      - next-major
      - beta
      - alpha
      - dev

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: "8.5"
            stability: prefer-lowest

    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up testing
        run: |
          vendor/bin/testbench package:create-sqlite-db
          vendor/bin/testbench-dusk package:create-sqlite-db
          vendor/bin/dusk-updater detect --auto-update
          npm run build
          CACHE_STORE=array REVERB_APP_ID=app-id REVERB_APP_KEY=app-key REVERB_APP_SECRET=app-secret vendor/bin/testbench reverb:start &
          npx wait-on tcp:127.0.0.1:8080

      - name: Execute tests
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          timeout_seconds: 600
          retry_on: error
          retry_wait_seconds: 5
          command: composer test -- --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser screenshots ${{ strategy.job-index }}
          path: tests/Browser/screenshots

      - name: Upload browser console logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser console ${{ strategy.job-index }}
          path: tests/Browser/console

      - name: Upload testbench core logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testbench core ${{ strategy.job-index }}
          path: vendor/orchestra/testbench-core/laravel/storage/logs/

      - name: Upload testbench dusk logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testbench dusk ${{ strategy.job-index }}
          path: vendor/orchestra/testbench-dusk/laravel/storage/logs/
